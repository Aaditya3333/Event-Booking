services:
  # Backend API Service
  - type: web
    name: event-booking-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: event-booking-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: ALGORITHM
        value: "HS256"
      - key: CORS_ORIGINS
        value: "https://event-booking-frontend.onrender.com"

  # Frontend Static Site
  - type: web
    name: event-booking-frontend
    runtime: static
    plan: free
    buildCommand: npm run build
    publishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://event-booking-api.onrender.com

databases:
  # PostgreSQL Database
  - name: event-booking-db
    plan: free
    databaseName: eventbooking
    user: eventbooking_user
